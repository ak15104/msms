<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSMS Student Search</title>
<style>
  :root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#17212b;
    --muted:#66727f;
    --line:#e2e7ec;
    --accent:#1769aa;
    --accent-dark:#0f4f82;
    --soft:#eef6fd;
    --danger:#a33a3a;
    --shadow:0 8px 24px rgba(22,34,48,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:28px 18px 50px}
  header{
    background:linear-gradient(135deg,#103b5c,#1769aa);
    color:#fff;
    border-radius:18px;
    padding:28px 26px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  h1{margin:0 0 6px;font-size:28px}
  .subtitle{opacity:.9;font-size:14px}
  .toolbar{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
  }
  input,select,button{
    font:inherit;
  }
  .search{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px 16px;
    outline:none;
    color:#16222d;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .clear{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    color:#fff;
    border-radius:11px;
    padding:0 18px;
    cursor:pointer;
  }
  .clear:hover{background:rgba(255,255,255,.2)}
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:18px;
  }
  .filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  select{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 11px;
    background:#fff;
    color:var(--text);
  }
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
  }
  .count{font-weight:700}
  .hint{font-size:12px;color:var(--muted)}
  .results{display:grid;gap:12px}
  .student{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 3px 12px rgba(22,34,48,.05);
    overflow:hidden;
  }
  .student-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:17px 18px;
    cursor:pointer;
  }
  .student-top:hover{background:#fafcff}
  .name{font-weight:800;font-size:17px}
  .meta{margin-top:5px;color:var(--muted);font-size:13px}
  .badge{
    white-space:nowrap;
    background:var(--soft);
    color:var(--accent-dark);
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:700;
  }
  .details{
    display:none;
    border-top:1px solid var(--line);
    padding:17px 18px 19px;
    background:#fbfcfd;
  }
  .student.open .details{display:block}
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .field .label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
  .field .value{font-size:14px;line-height:1.4;word-break:break-word}
  .empty{
    background:#fff;
    border:1px dashed #cbd4dd;
    border-radius:var(--radius);
    padding:38px 20px;
    text-align:center;
    color:var(--muted);
  }
  .empty strong{display:block;color:var(--text);margin-bottom:6px}
  .footer{
    margin-top:18px;
    font-size:11px;
    color:var(--muted);
    text-align:center;
    line-height:1.5;
  }
  @media(max-width:800px){
    .filters{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){
    .wrap{padding:14px 10px 35px}
    header{padding:22px 17px}
    h1{font-size:23px}
    .toolbar{grid-template-columns:1fr}
    .clear{height:42px}
    .filters,.grid{grid-template-columns:1fr}
    .student-top{align-items:flex-start}
    .badge{font-size:11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MSMS Student Search</h1>
    <div class="subtitle">Master Student List • Offline Search Tool</div>
    <div class="toolbar">
      <input id="search" class="search" type="search"
        placeholder="Search name, admission no., parent name, mobile, address..."
        autocomplete="off">
      <button id="clear" class="clear" type="button">Clear</button>
    </div>
  </header>

  <section class="panel">
    <div class="filters">
      <div>
        <label for="classFilter">CLASS</label>
        <select id="classFilter"><option value="">All Classes</option></select>
      </div>
      <div>
        <label for="sectionFilter">SECTION</label>
        <select id="sectionFilter"><option value="">All Sections</option></select>
      </div>
      <div>
        <label for="genderFilter">GENDER</label>
        <select id="genderFilter"><option value="">All</option></select>
      </div>
      <div>
        <label for="categoryFilter">SOCIAL CATEGORY</label>
        <select id="categoryFilter"><option value="">All Categories</option></select>
      </div>
    </div>
  </section>

  <section class="panel stats">
    <div class="count" id="count"></div>
    <div class="hint">Click a student to view full details.</div>
  </section>

  <main id="results" class="results"></main>

  <div class="footer">
    Local/offline tool. The student data is embedded in this HTML file and is not sent to a server.
  </div>
</div>

const els = {
  search: document.getElementById('search'),
  clear: document.getElementById('clear'),
  classFilter: document.getElementById('classFilter'),
  sectionFilter: document.getElementById('sectionFilter'),
  genderFilter: document.getElementById('genderFilter'),
  categoryFilter: document.getElementById('categoryFilter'),
  count: document.getElementById('count'),
  results: document.getElementById('results')
};

const FIELDS = [
  ['Admission No','Admission No'],
  ['Class','Class'],
  ['Section','Section'],
  ['Gender','Gender'],
  ['Date of Admission','Date of Admission'],
  ['Date of Birth','Date of Birth'],
  ['Father Name','Father Name'],
  ['Mother Name','Mother Name'],
  ['Social Category','Social Category'],
  ['Father Mobile','Father MobileNo'],
  ['Mother Mobile','Mother MobileNo'],
  ['Permanent Address','Permanent Address'],
  ['Permanent City','Permanent City'],
  ['Father Occupation','Father Occupation']
];

function uniqueValues(key){
  return [...new Set(STUDENTS.map(s => s[key]).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
}

function fillSelect(select, values){
  values.forEach(v => {
    const option = document.createElement('option');
    option.value = v;
    option.textContent = v;
    select.appendChild(option);
  });
}

fillSelect(els.classFilter, uniqueValues('Class'));
fillSelect(els.sectionFilter, uniqueValues('Section'));
fillSelect(els.genderFilter, uniqueValues('Gender'));
fillSelect(els.categoryFilter, uniqueValues('Social Category'));

function normalize(value){
  return String(value ?? '').toLowerCase().trim();
}

function matches(student){
  const query = normalize(els.search.value);
  const q = query.replace(/\s+/g,' ');

  if (els.classFilter.value && student.Class !== els.classFilter.value) return false;
  if (els.sectionFilter.value && student.Section !== els.sectionFilter.value) return false;
  if (els.genderFilter.value && student.Gender !== els.genderFilter.value) return false;
  if (els.categoryFilter.value && student['Social Category'] !== els.categoryFilter.value) return false;

  if (!q) return true;

  // Search across all fields, including numbers and addresses.
  return Object.values(student).some(value =>
    normalize(value).replace(/\s+/g,' ').includes(q)
  );
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[ch]));
}

function render(){
  const filtered = STUDENTS.filter(matches);
  els.count.textContent = `${filtered.length.toLocaleString('en-IN')} student${filtered.length === 1 ? '' : 's'} found`;

  if (!filtered.length){
    els.results.innerHTML = `
      <div class="empty">
        <strong>No matching student found</strong>
        Try a different name, admission number, parent name, mobile number, or filter.
      </div>`;
    return;
  }

  els.results.innerHTML = filtered.map((s, i) => {
    const details = FIELDS.map(([label,key]) => `
      <div class="field">
        <div class="label">${escapeHtml(label)}</div>
        <div class="value">${escapeHtml(s[key] || '—')}</div>
      </div>
    `).join('');

    return `
      <article class="student" data-index="${i}">
        <div class="student-top">
          <div>
            <div class="name">${escapeHtml(s['Student Name'])}</div>
            <div class="meta">
              Admission No. ${escapeHtml(s['Admission No'] || '—')}
              · Class ${escapeHtml(s['Class'] || '—')}-${escapeHtml(s['Section'] || '—')}
              · ${escapeHtml(s['Gender'] || '—')}
            </div>
          </div>
          <div class="badge">View details</div>
        </div>
        <div class="details">
          <div class="grid">${details}</div>
        </div>
      </article>`;
  }).join('');

  document.querySelectorAll('.student-top').forEach(top => {
    top.addEventListener('click', () => {
      top.parentElement.classList.toggle('open');
    });
  });
}

[els.search, els.classFilter, els.sectionFilter, els.genderFilter, els.categoryFilter]
  .forEach(el => el.addEventListener('input', render));

els.clear.addEventListener('click', () => {
  els.search.value = '';
  els.classFilter.value = '';
  els.sectionFilter.value = '';
  els.genderFilter.value = '';
  els.categoryFilter.value = '';
  render();
  els.search.focus();
});

render();
</script>
